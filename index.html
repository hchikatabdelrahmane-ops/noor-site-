<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor — Bibliothèque Islamique</title>
<style>
  :root {
    --background: #050505;
    --foreground: #f2f2f2;
    --card: #0b0b0b;
    --muted: #6f6f6f;
    --border: #232323;
    --primary: #c9a24d; /* or */
    --primary-foreground: #0f0f0f;
    --destructive: #a83232;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  ::selection { background: rgba(201,162,77,.3); color: var(--foreground); }

  .gold { color: var(--primary); }

  /* ---------- Golden scroll rule ---------- */
  #golden-rule {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(201,162,77,.6), transparent);
    z-index: 60;
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 6%;
    mix-blend-mode: difference;
  }

  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { color: var(--primary); transition: transform .3s; }
  .brand:hover svg { transform: rotate(12deg); }
  .brand span {
    font-size: 13px; letter-spacing: .3em; text-transform: uppercase; font-weight: 300;
  }

  nav.desktop-nav { display: flex; gap: 40px; }
  nav.desktop-nav a {
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase; font-weight: 300;
    color: rgba(242,242,242,.7);
    transition: color .2s;
  }
  nav.desktop-nav a:hover, nav.desktop-nav a.active { color: var(--primary); }

  #menu-toggle {
    display: none;
    background: none; border: none; color: var(--foreground);
  }

  #mobile-menu {
    display: none;
    position: fixed; inset: 0; z-index: 30;
    background: rgba(5,5,5,.97);
    backdrop-filter: blur(20px);
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
  }
  #mobile-menu.open { display: flex; }
  #mobile-menu a { font-size: 24px; font-weight: 300; color: rgba(242,242,242,.85); }
  #mobile-menu a:hover { color: var(--primary); }

  @media (max-width: 768px) {
    nav.desktop-nav { display: none; }
    #menu-toggle { display: block; }
  }

  main { min-height: 70vh; }

  /* ---------- Intro splash ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 50;
    background: var(--background);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .8s ease;
  }
  #intro span {
    font-size: 64px; font-weight: 200; color: var(--primary);
    letter-spacing: .1em;
    font-family: ui-serif, Georgia, serif;
    animation: intro-in 1s ease-out;
  }
  @keyframes intro-in {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }
  #intro.hide { opacity: 0; pointer-events: none; }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 90vh;
    display: flex; align-items: center;
    padding: 0 6%;
  }
  .hero-inner {
    max-width: 1150px; margin: 0 auto; width: 100%;
    display: grid; grid-template-columns: 1fr; gap: 48px;
  }
  @media (min-width: 860px) {
    .hero-inner { grid-template-columns: 1fr 1fr; align-items: center; }
  }
  .eyebrow {
    font-size: 11px; letter-spacing: .4em; text-transform: uppercase;
    color: var(--primary); margin-bottom: 22px; font-weight: 300;
  }
  h1.hero-title {
    font-size: clamp(38px, 6vw, 68px);
    font-weight: 200; line-height: 1.05; letter-spacing: -.01em; margin: 0 0 30px;
  }
  h1.hero-title em {
    color: var(--primary); font-style: italic; font-family: ui-serif, Georgia, serif;
  }
  .hero-lede {
    font-size: 17px; color: var(--muted); font-weight: 300; line-height: 1.7;
    max-width: 420px; margin: 0 0 36px;
  }
  .cta-link {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; letter-spacing: .2em; text-transform: uppercase; font-weight: 300;
    transition: color .2s;
  }
  .cta-link:hover { color: var(--primary); }
  .cta-link svg { transition: transform .2s; }
  .cta-link:hover svg { transform: translateX(4px); }

  .featured-wrap { position: relative; max-width: 340px; margin: 0 auto; }
  .featured-cover {
    position: relative; aspect-ratio: 2/3; border-radius: 2px; overflow: hidden;
    box-shadow: 0 0 60px -10px rgba(201,162,77,.35);
  }
  .featured-caption {
    position: absolute; bottom: -22px; right: -22px;
    background: var(--background); border: 1px solid var(--border);
    padding: 12px 16px; max-width: 190px;
  }
  .featured-caption .tag { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--primary); margin: 0 0 4px; }
  .featured-caption .title { font-size: 13px; font-weight: 300; margin: 0; }

  .cover-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 20px;
    background: linear-gradient(155deg, #14120c, #060605 70%);
    border: 1px solid var(--border);
    font-family: ui-serif, Georgia, serif;
    color: rgba(201,162,77,.85);
    font-size: 15px; font-weight: 300; line-height: 1.4;
  }

  /* ---------- Sections ---------- */
  section.block { padding: 90px 6%; }
  .block-inner { max-width: 1150px; margin: 0 auto; }
  .block-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 56px; gap: 20px; flex-wrap: wrap; }
  .block-head h2 { font-size: 30px; font-weight: 300; margin: 0; }
  .see-all { display: none; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .see-all:hover { color: var(--primary); }
  @media (min-width: 768px) { .see-all { display: inline-flex; } }

  .grid-books {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
  }
  @media (min-width: 768px) { .grid-books { grid-template-columns: repeat(4, 1fr); gap: 32px; } }

  .book-card { display: block; }
  .book-cover {
    position: relative; aspect-ratio: 2/3; overflow: hidden; border-radius: 2px;
    background: var(--card);
  }
  .book-cover .cover-placeholder { transition: transform .6s; }
  .book-card:hover .cover-placeholder { transform: scale(1.05); }
  .book-cover .hover-label {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.8), transparent 60%);
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22px;
    opacity: 0; transition: opacity .4s;
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--primary); font-weight: 300;
  }
  .book-card:hover .hover-label { opacity: 1; }
  .book-meta { margin-top: 14px; padding: 0 2px; }
  .book-meta h3 { font-size: 15px; font-weight: 500; margin: 0; line-height: 1.3; }
  .book-card:hover .book-meta h3 { color: var(--primary); }
  .book-meta p { font-size: 12px; color: var(--muted); margin: 4px 0 0; font-weight: 300; }

  .empty-note { color: var(--muted); font-weight: 300; }

  /* Quote */
  .quote-block {
    padding: 120px 6%; border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06);
    text-align: center;
  }
  .quote-block blockquote {
    max-width: 720px; margin: 0 auto; font-family: ui-serif, Georgia, serif;
    font-size: clamp(24px, 3.5vw, 36px); font-weight: 200; line-height: 1.5; color: rgba(242,242,242,.9);
  }
  .quote-block cite {
    display: block; margin-top: 30px; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--primary);
    font-style: normal; font-weight: 300;
  }

  /* ---------- Library page ---------- */
  .page-pad { padding: 130px 6% 100px; }
  .page-head { max-width: 720px; margin-bottom: 56px; }
  .page-head .eyebrow { margin-bottom: 16px; }
  .page-head h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 200; margin: 0 0 22px; }
  .page-head p { color: var(--muted); font-weight: 300; line-height: 1.7; }

  .search-wrap { position: relative; max-width: 380px; margin-bottom: 40px; }
  .search-wrap svg { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-wrap input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border);
    padding: 12px 8px 12px 28px; font-size: 14px; font-weight: 300; color: var(--foreground);
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--primary); }
  .search-wrap input::placeholder { color: rgba(111,111,111,.7); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 56px; }
  .chip {
    padding: 8px 16px; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; font-weight: 300;
    border: 1px solid var(--border); border-radius: 2px; background: none; color: var(--muted);
    transition: all .2s;
  }
  .chip:hover { color: var(--foreground); border-color: rgba(255,255,255,.3); }
  .chip.active { color: var(--primary); border-color: var(--primary); background: rgba(201,162,77,.06); }

  /* ---------- Book detail page ---------- */
  .detail-grid { display: grid; gap: 60px; }
  @media (min-width: 860px) { .detail-grid { grid-template-columns: 2fr 3fr; gap: 80px; } }
  .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 48px; }
  .back-link:hover { color: var(--primary); }
  .detail-cover-wrap { position: relative; }
  .detail-cover {
    aspect-ratio: 2/3; border-radius: 2px; overflow: hidden;
    box-shadow: 0 0 60px -10px rgba(201,162,77,.3);
  }
  .detail-category { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--primary); margin: 0 0 18px; font-weight: 300; }
  .detail-title { font-size: clamp(30px, 4vw, 42px); font-weight: 300; margin: 0 0 14px; line-height: 1.2; }
  .detail-author { font-size: 17px; color: var(--muted); font-style: italic; font-weight: 300; margin: 0 0 30px; }
  .detail-facts { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 40px; font-size: 12px; color: var(--muted); font-weight: 300; }
  .detail-summary-label { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; font-weight: 300; }
  .detail-desc { font-size: 16px; line-height: 1.85; color: rgba(242,242,242,.85); font-weight: 300; white-space: pre-line; margin: 0 0 46px; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 16px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.08); }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px;
    font-size: 12px; letter-spacing: .15em; text-transform: uppercase; font-weight: 300;
    border-radius: 2px; border: 1px solid transparent; transition: all .2s;
  }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover { background: #d7ae5b; }
  .btn-outline { border-color: var(--border); color: var(--foreground); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .unavailable { font-size: 13px; color: var(--muted); font-style: italic; display: flex; align-items: center; gap: 8px; }

  /* ---------- Suggestions page ---------- */
  .form-card {
    background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 2px;
    padding: 40px; max-width: 640px; margin: 0 auto;
  }
  .field { margin-bottom: 24px; }
  .field label {
    display: block; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px; font-weight: 300;
  }
  .field input, .field textarea {
    width: 100%; background: transparent; border: 1px solid var(--border); border-radius: 2px;
    padding: 10px 12px; font-size: 14px; font-weight: 300; color: var(--foreground); outline: none;
    transition: border-color .2s;
  }
  .field input:focus, .field textarea:focus { border-color: var(--primary); }
  .field textarea { resize: vertical; min-height: 100px; }
  .form-error { color: var(--destructive); font-size: 14px; margin: 0 0 16px; font-weight: 300; }
  .form-success {
    margin-top: 20px; font-size: 14px; color: var(--primary); font-weight: 300;
    display: flex; align-items: center; gap: 8px;
  }
  .submit-btn {
    margin-top: 8px; display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 30px; background: var(--primary); color: var(--primary-foreground);
    border: none; border-radius: 2px; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; font-weight: 300;
  }
  .submit-btn:hover { background: #d7ae5b; }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; }

  .suggestions-list { max-width: 640px; margin: 70px auto 0; }
  .suggestions-list h2 {
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 8px; margin-bottom: 22px; font-weight: 300;
  }
  .suggestion-item {
    padding: 16px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
    border-radius: 2px; margin-bottom: 12px;
  }
  .suggestion-item .theme { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .suggestion-item .details { font-size: 13px; color: var(--muted); font-weight: 300; line-height: 1.6; margin: 0 0 8px; }
  .suggestion-item .author { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: rgba(111,111,111,.7); font-weight: 300; }
  .empty-hint { color: var(--muted); font-style: italic; font-size: 14px; font-weight: 300; text-align: center; }

  /* ---------- 404 ---------- */
  .not-found { padding: 200px 6% 120px; text-align: center; }
  .not-found h1 { font-size: 80px; font-weight: 200; color: var(--primary); margin: 0; }
  .not-found p { color: var(--muted); font-weight: 300; margin: 16px 0 30px; }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid rgba(255,255,255,.06);
    padding: 46px 6%; margin-top: 90px;
  }
  .footer-inner {
    max-width: 1150px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 22px;
  }
  @media (min-width: 768px) { .footer-inner { flex-direction: row; } }
  .footer-inner p { margin: 0; font-weight: 300; }
  .footer-inner .brand-line { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .footer-inner .quote-line { font-size: 12px; color: var(--muted); font-style: italic; }

  :root { --side: max(6vw, calc((100vw - 1200px) / 2)); }
 
/* ---------- Header ---------- */
header { padding: 28px var(--side); }
.brand svg { width: 26px; height: 26px; }
.brand span { font-size: 20px; letter-spacing: .3em; font-weight: 400; }
nav.desktop-nav { gap: 52px; }
nav.desktop-nav a { font-size: 14px; letter-spacing: .2em; }
 
/* ---------- Centrage global ---------- */
.hero, section.block, .quote-block, footer { padding-left: var(--side); padding-right: var(--side); }
.hero-inner, .block-inner, .footer-inner { max-width: 1200px; }
.page-pad { padding: 160px var(--side) 110px; max-width: none !important; margin: 0; }
 
/* ---------- Textes généraux ---------- */
.eyebrow { font-size: 14px; letter-spacing: .35em; }
 
/* ---------- Accueil ---------- */
.hero { min-height: 85vh; }
h1.hero-title { font-size: clamp(48px, 6.5vw, 88px); }
.hero-lede { font-size: 20px; max-width: 520px; line-height: 1.75; }
.cta-link { font-size: 15px; }
.featured-wrap { max-width: 300px; }
.featured-caption { padding: 14px 18px; max-width: 220px; }
.featured-caption .tag { font-size: 11px; }
.featured-caption .title { font-size: 15px; }
.block-head h2 { font-size: 38px; }
.see-all { font-size: 13px; }
.quote-block blockquote { font-size: clamp(28px, 3.8vw, 42px); }
.quote-block cite { font-size: 13px; }
 
/* ---------- Grille des livres (plus petits, bien alignés) ---------- */
.grid-books {
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 36px 28px;
}
@media (max-width: 600px) { .grid-books { grid-template-columns: repeat(2, 1fr); gap: 24px 16px; } }
.cover-placeholder { font-size: 17px; padding: 18px; }
.book-meta h3 { font-size: 17px; }
.book-meta p { font-size: 14px; }
.book-cover .hover-label { font-size: 12px; }
 
/* ---------- Page Bibliothèque ---------- */
.page-head { max-width: 760px; margin-bottom: 56px; }
.page-head h1 { font-size: clamp(46px, 5.5vw, 72px); }
.page-head p { font-size: 19px; line-height: 1.75; }
 
.search-wrap { max-width: 520px; margin-bottom: 44px; }
.search-wrap svg { width: 20px; height: 20px; }
.search-wrap input { font-size: 18px; padding: 16px 10px 16px 38px; }
 
.chip-row { gap: 12px; margin-bottom: 64px; }
.chip { font-size: 13px; padding: 12px 24px; letter-spacing: .15em; }
 
/* ---------- Fiche livre ---------- */
.detail-grid { max-width: 1100px; }
@media (min-width: 860px) { .detail-grid { grid-template-columns: 300px 1fr; gap: 80px; } }
.back-link { font-size: 13px; }
.detail-category { font-size: 13px; }
.detail-title { font-size: clamp(34px, 4.5vw, 52px); }
.detail-author { font-size: 20px; }
.detail-facts { font-size: 15px; }
.detail-summary-label { font-size: 13px; }
.detail-desc { font-size: 18px; line-height: 1.85; }
.btn { font-size: 14px; padding: 18px 34px; }
 
/* ---------- Suggestions ---------- */
.form-card { padding: 48px; max-width: 700px; }
.field label { font-size: 12px; }
.field input, .field textarea { font-size: 17px; padding: 14px 16px; }
.submit-btn { font-size: 14px; padding: 18px 34px; }
.suggestions-list { max-width: 700px; }
.suggestions-list h2 { font-size: 13px; }
.suggestion-item .theme { font-size: 17px; }
.suggestion-item .details { font-size: 15px; }
.suggestion-item .author { font-size: 12px; }
 
/* ---------- Footer ---------- */
.footer-inner .brand-line { font-size: 13px; }
.footer-inner .quote-line { font-size: 15px; }
 
/* ---------- Menu mobile ---------- */
#mobile-menu a { font-size: 28px; }

/* Couvertures e-books */
.book-cover, .featured-cover, .detail-cover { aspect-ratio: 27 / 40; }

.cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .6s;
}
.book-card:hover .cover-img { transform: scale(1.05); }
</style>
</head>
<body>

<div id="golden-rule"></div>
<div id="intro"><span>اقرأ</span></div>

<header>
  <a href="#/" class="brand">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Noor</span>
  </a>
  <nav class="desktop-nav" id="desktop-nav">
    <a href="#/" data-route="/">Accueil</a>
    <a href="#/library" data-route="/library">Bibliothèque</a>
    <a href="#/suggestions" data-route="/suggestions">Suggestions</a>
  </nav>
  <button id="menu-toggle" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</header>

<div id="mobile-menu">
  <a href="#/">Accueil</a>
  <a href="#/library">Bibliothèque</a>
  <a href="#/suggestions">Suggestions</a>
</div>

<main id="app"></main>

<footer>
  <div class="footer-inner">
    <p class="brand-line">Bibliothèque Islamique · Noor</p>
    <p class="quote-line">« Lis, au nom de ton Seigneur qui a créé. »</p>
  </div>
</footer>

const SUG_KEY = "noor_suggestions";

function loadSuggestions() {
  try { return JSON.parse(localStorage.getItem(SUG_KEY)) || []; }
  catch { return []; }
}
function saveSuggestion(s) {
  const list = loadSuggestions();
  list.unshift({ ...s, id: Date.now() });
  localStorage.setItem(SUG_KEY, JSON.stringify(list));
  return list;
}

/* ====== COMPTEUR DE TÉLÉCHARGEMENTS ====== */
const COUNTER_NS = "noor-bibliotheque-REMPLACE-MOI-8472"; // mets ici un texte unique à toi
const COUNTER_API = "https://abacus.jasoncameron.dev";

async function getDownloads(bookId) {
  try {
    const r = await fetch(`${COUNTER_API}/get/${COUNTER_NS}/book-${bookId}`);
    if (!r.ok) return 0;
    return (await r.json()).value || 0;
  } catch { return 0; }
}

async function addDownload(bookId) {
  try {
    const r = await fetch(`${COUNTER_API}/hit/${COUNTER_NS}/book-${bookId}`, { keepalive: true });
    return (await r.json()).value;
  } catch { return null; }
}

const app = document.getElementById("app");

function coverPlaceholder(book) {
  if (book.cover) {
    return `<img class="cover-img" src="${book.cover}" alt="${escapeHtml(book.title)}" loading="lazy">`;
  }
  return `<div class="cover-placeholder">${escapeHtml(book.title)}</div>`;
}

function escapeHtml(str = "") {
  return str.replace(/[&<>"']/g, (m) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}

function bookCard(book) {
  return `
    <a class="book-card" href="#/book/${book.id}">
      <div class="book-cover">
        ${coverPlaceholder(book)}
        <div class="hover-label">Lire la fiche</div>
      </div>
      <div class="book-meta">
        <h3>${escapeHtml(book.title)}</h3>
        <p>${escapeHtml(book.author || "")}</p>
      </div>
    </a>`;
}

let filterState = { category: "Tous", search: "" };

function renderLibrary() {
  const categories = ["Tous", ...new Set(BOOKS.map(b => b.category).filter(Boolean))];

  const draw = () => {
    const filtered = BOOKS.filter(b => {
      const matchCat = filterState.category === "Tous" || b.category === filterState.category;
      const q = filterState.search.toLowerCase();
      const matchSearch = !q || b.title.toLowerCase().includes(q) || (b.author || "").toLowerCase().includes(q);
      return matchCat && matchSearch;
    });
    document.getElementById("lib-grid").innerHTML = filtered.length
      ? filtered.map(bookCard).join("")
      : `<p class="empty-note" style="grid-column:1/-1;">Aucun ouvrage ne correspond à votre recherche.</p>`;
  };

  app.innerHTML = `
    <div class="page-pad">
      <div class="page-head">
        <p class="eyebrow">La Galerie</p>
        <h1>Bibliothèque</h1>
        <p>Parcourez la collection d'e-books. Chaque ouvrage est accessible librement, en lecture ou en téléchargement.</p>
      </div>

      <div class="search-wrap">
        ${ICONS.search}
        <input id="lib-search" type="text" placeholder="Rechercher un titre ou un auteur…">
      </div>

      <div class="chip-row" id="lib-chips">
        ${categories.map(c => `<button class="chip ${c === "Tous" ? "active" : ""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}
      </div>

      <div class="grid-books" id="lib-grid"></div>
    </div>
  `;

  filterState = { category: "Tous", search: "" };
  draw();

  document.getElementById("lib-search").addEventListener("input", (e) => {
    filterState.search = e.target.value;
    draw();
  });

  document.getElementById("lib-chips").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    filterState.category = btn.dataset.cat;
    document.querySelectorAll("#lib-chips .chip").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    draw();
  });
}

        <a class="cta-link" href="#/library">Retour à la bibliothèque</a>

              <a class="btn btn-primary" href="${book.file_url}" target="_blank" rel="noopener noreferrer">${ICONS.book} Lire maintenant</a>
              <a class="btn btn-outline" id="dl-btn" href="${book.file_url}" download>${ICONS.download} Télécharger</a>
            ` : `<p class="unavailable">${ICONS.heart} Fichier non disponible pour le moment.</p>`}
          </div>
        </div>
      </div>
                <p id="dl-count" style="margin-top:18px;font-size:15px;color:var(--muted);font-weight:300;"></p>
    </div>
  `;
    const dlCount = document.getElementById("dl-count");
  const dlBtn = document.getElementById("dl-btn");
  const label = (n) => `${n} téléchargement${n > 1 ? "s" : ""}`;

  if (dlCount) getDownloads(book.id).then(n => { dlCount.textContent = label(n); });

  if (dlBtn) {
    dlBtn.addEventListener("click", async () => {
      const n = await addDownload(book.id);
      if (n !== null && dlCount) dlCount.textContent = label(n);
    });
  }
}

        </div>
        <div class="field">
          <label>Précisions (optionnel)</label>
          <textarea id="sug-details" maxlength="800" placeholder="Décrivez ce que vous aimeriez y trouver…"></textarea>
        </div>
        <div class="field">
          <label>Votre nom (optionnel)</label>
          <input id="sug-author" type="text" maxlength="60" placeholder="Anonyme par défaut">
        </div>
        <button type="submit" class="submit-btn" id="sug-submit">${ICONS.send} Envoyer ma suggestion</button>
        <p class="form-success" id="sug-success" style="display:none;">${ICONS.sparkles} Merci ! Votre suggestion a bien été enregistrée.</p>
      </form>

      <div class="suggestions-list">
        <h2>${ICONS.heart} Suggestions récentes</h2>
        <div id="sug-list"></div>
      </div>
    </div>
  `;

  drawList();

  document.getElementById("sug-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const theme = document.getElementById("sug-theme").value.trim();
    const details = document.getElementById("sug-details").value.trim();
    const author_name = document.getElementById("sug-author").value.trim();
    const errorEl = document.getElementById("sug-error");
    const successEl = document.getElementById("sug-success");

    if (!theme) {
      errorEl.textContent = "Veuillez indiquer un thème.";
      errorEl.style.display = "block";
      return;
    }
    errorEl.style.display = "none";

    saveSuggestion({ theme, details, author_name });
    document.getElementById("sug-theme").value = "";
    document.getElementById("sug-details").value = "";
    document.getElementById("sug-author").value = "";
    drawList();

    successEl.style.display = "flex";
    setTimeout(() => { successEl.style.display = "none"; }, 4000);
  });
}

async function renderStats() {
  app.innerHTML = `<div class="page-pad"><div class="page-head"><p class="eyebrow">Admin</p><h1>Statistiques</h1></div><div id="stats-body"><p class="empty-note">Chargement…</p></div></div>`;
  const counts = await Promise.all(BOOKS.map(b => getDownloads(b.id)));
  const total = counts.reduce((a, b) => a + b, 0);
  document.getElementById("stats-body").innerHTML = `
    <div style="max-width:640px;">
      ${BOOKS.map((b, i) => `
        <div style="display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--border);font-size:18px;font-weight:300;">
          <span>${escapeHtml(b.title)}</span>
          <span class="gold" style="font-size:22px;">${counts[i]}</span>
        </div>`).join("")}
      <div style="display:flex;justify-content:space-between;padding:24px 0;font-size:18px;">
        <span>Total</span><span class="gold" style="font-size:26px;">${total}</span>
      </div>
    </div>`;
}

function renderNotFound() {
  app.innerHTML = `
    <div class="not-found">
      <h1>404</h1>
      <p>Cette page n'existe pas.</p>
      <a class="cta-link" href="#/" style="justify-content:center;">${ICONS.arrowLeft} Retour à l'accueil</a>
    </div>`;
}

/* ============================================================
   ROUTEUR
   ============================================================ */
function router() {
  const hash = window.location.hash || "#/";
  const path = hash.slice(1); // enlève le #

  document.querySelectorAll("#desktop-nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.route === path || (a.dataset.route === "/" && path === ""));
  });

  window.scrollTo(0, 0);
  closeMobileMenu();

  if (path === "" || path === "/") return renderHome();
  if (path === "/library") return renderLibrary();
  if (path === "/suggestions") return renderSuggestions();
  if (path === "/stats") return renderStats();
  const bookMatch = path.match(/^\/book\/(.+)$/);
  if (bookMatch) return renderBookDetail(bookMatch[1]);
  return renderNotFound();
}

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

/* ============================================================
   MENU MOBILE
   ============================================================ */
const mobileMenu = document.getElementById("mobile-menu");
document.getElementById("menu-toggle").addEventListener("click", () => {
  mobileMenu.classList.toggle("open");
});
function closeMobileMenu() { mobileMenu.classList.remove("open"); }

/* ============================================================
   BARRE DE PROGRESSION DORÉE
   ============================================================ */
window.addEventListener("scroll", () => {
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (window.scrollY / docHeight) * 100 : 0;
  document.getElementById("golden-rule").style.top = progress + "%";
});

/* ============================================================
   ANIMATION D'INTRO (une seule fois par visite, sur l'accueil)
   ============================================================ */
let introShown = false;
function showIntroIfNeeded() {
  const intro = document.getElementById("intro");
  if (introShown) { intro.style.display = "none"; return; }
  introShown = true;
  intro.style.display = "flex";
  intro.classList.remove("hide");
  setTimeout(() => {
    intro.classList.add("hide");
    setTimeout(() => { intro.style.display = "none"; }, 800);
  }, 1500);
}
</script>
